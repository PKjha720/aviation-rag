# Theme values mirror the design tokens in app.py (:root). Keep them in sync:
# Streamlit paints its own widgets from here, the CSS paints everything else.
[theme]
base = "dark"
primaryColor = "#4c8dff"
backgroundColor = "#0b0f16"
secondaryBackgroundColor = "#121926"
textColor = "#dbe3ef"
font = "sans serif"

[server]
headless = true
port = 8501
