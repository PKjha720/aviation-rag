# Theme values mirror the design tokens in app.py (:root). Keep them in sync:
# Streamlit paints its own widgets from here, the CSS paints everything else.
[theme]
base = "light"
primaryColor = "#035eff"
backgroundColor = "#f2f5f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f1823"
font = "sans serif"

[server]
headless = true
port = 8501
